name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repo:
    name: Kontroly repa a testy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: check_repo.py
        run: python3 scripts/check_repo.py
      - name: Unit testy
        run: for d in tools/*/tests; do python3 -m unittest discover -s "$d" -p 'test_*.py' -v || exit 1; done
      - name: Syntaxe Python skriptů
        run: python3 -m py_compile $(git ls-files '*.py')
      - name: Syntaxe shell skriptů
        run: for f in $(git ls-files '*.sh'); do sh -n "$f"; done

  plugin-validate:
    name: claude plugin validate --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Verze připnutá záměrně (toolkit drží připnuté závislosti). Při upgradu ověř lokálně.
      - run: npm install -g @anthropic-ai/claude-code@2.1.290
      - name: Validace marketplace a pluginů
        run: |
          claude --version
          claude plugin validate . --strict
          for source in $(python3 -c 'import json; print(" ".join(p["source"] for p in json.load(open(".claude-plugin/marketplace.json"))["plugins"]))'); do
            claude plugin validate "$source" --strict
          done

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: gitleaks dir
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /repo --redact --no-banner --verbose
